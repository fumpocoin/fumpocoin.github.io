<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FUMPO Moon Run</title>
<meta name="description" content="Run across the moon as FUMPO, grab coins and dodge rocks and rockets. Free browser game.">
<meta property="og:title" content="FUMPO Moon Run">
<meta property="og:description" content="Run across the moon, grab coins, dodge rocks. How far can you get?">
<meta property="og:image" content="https://fumpocoin.xyz/og.jpg">
<meta property="og:url" content="https://fumpocoin.xyz/game.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="logo.png">
<style>
  :root { --bg: #12081f; --panel: #1d1030; --line: #35204f; --text: #f4eeff; --muted: #b9a8d6; --purple: #a24bff; --lime: #b6ff3c; --ink: #12081f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.5 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 12px 16px 32px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .top a { color: var(--lime); text-decoration: none; font-weight: 800; }
  .top h1 { margin: 0; font-size: 22px; font-weight: 900; }
  .stage { position: relative; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: #0b0416; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
  .hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; padding: 10px 14px; font-weight: 900; font-variant-numeric: tabular-nums; pointer-events: none; text-shadow: 0 2px 0 rgba(0, 0, 0, .5); }
  .hud small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
  .hud .r { text-align: right; }
  .mute { position: absolute; right: 10px; bottom: 10px; border: 1px solid var(--line); background: rgba(18, 8, 31, .7); color: var(--text); border-radius: 10px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(11, 4, 22, .72); padding: 16px; }
  .overlay[hidden] { display: none; }
  .card { max-width: 420px; }
  .card h2 { margin: 0 0 6px; font-size: clamp(26px, 6vw, 40px); line-height: 1.05; color: var(--lime); text-shadow: 0 3px 0 var(--purple); font-weight: 900; }
  .card p { margin: 0 0 14px; color: var(--muted); }
  .card .big { font-size: 20px; color: var(--text); font-weight: 800; margin-bottom: 4px; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  button.b, a.b { border: 2px solid var(--purple); background: transparent; color: var(--text); border-radius: 14px; padding: 11px 18px; font: inherit; font-weight: 800; cursor: pointer; text-decoration: none; }
  button.b.primary { background: var(--lime); border-color: var(--lime); color: var(--ink); }
  .how { color: var(--muted); font-size: 14px; margin: 12px 0 0; text-align: center; }
  @media (max-width: 560px) { canvas { aspect-ratio: 1 / 1; } .top h1 { font-size: 18px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="./">&larr; fumpocoin.xyz</a>
    <h1>FUMPO Moon Run</h1>
  </div>

  <div class="stage" id="stage">
    <canvas id="c" width="800" height="450"></canvas>
    <div class="hud">
      <div><small>Score</small><span id="score">0</span></div>
      <div class="r"><small>Best</small><span id="best">0</span></div>
    </div>
    <button class="mute" id="mute" type="button" aria-pressed="false">Sound on</button>

    <div class="overlay" id="start">
      <div class="card">
        <h2>Moon Run</h2>
        <p>FUMPO is late for the moon party. Grab coins, dodge rocks and rockets.</p>
        <div class="btns"><button class="b primary" id="play" type="button">Play</button></div>
        <p class="how" style="margin-top:14px">Tap or press Space to jump. Tap again in the air for a double jump.</p>
      </div>
    </div>

    <div class="overlay" id="over" hidden>
      <div class="card">
        <h2 id="over-title">Bonk!</h2>
        <p class="big"><span id="final">0</span> points</p>
        <p id="over-sub"></p>
        <div class="btns">
          <button class="b primary" id="again" type="button">Play again</button>
          <button class="b" id="share" type="button">Share score</button>
        </div>
      </div>
    </div>
  </div>
  <p class="how">A free game for fun. Scores have no value and cannot be traded for anything.</p>
</div>

<script>
(() => {
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const $ = (id) => document.getElementById(id);
  let W = 800, H = 450, GROUND = 370, dpr = 1, MAXSPEED = 820;

  function fit() {
    const r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    // phones get a narrower logical world, so FUMPO and the rocks stay big enough to see
    W = r.width < 560 ? 460 : 800; H = Math.round(W * r.height / r.width);
    MAXSPEED = W < 600 ? 540 : 820;
    GROUND = H - 80;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", fit);

  // ---- storage (may be unavailable in private mode)
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  let best = Number(store.get("fumpo-run-best", 0)) || 0;
  let muted = store.get("fumpo-run-muted", "0") === "1";

  // ---- sound: tiny synth beeps, created on first tap
  let ac = null;
  function beep(freq, dur, type = "square", vol = 0.05, slide = 0) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), ac.currentTime + dur);
      g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
    } catch {}
  }

  // ---- art
  const face = new Image(); face.src = "logo.png";
  const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * 800, y: Math.random(), s: Math.random() * 1.6 + 0.4, z: Math.random() * 0.5 + 0.1 }));
  const craters = Array.from({ length: 9 }, (_, i) => ({ x: i * 110 + Math.random() * 60, w: 26 + Math.random() * 34 }));

  // ---- state
  const GRAV = 2300, JUMP = 760, R = 30;
  let state = "start", t = 0, speed = 0, dist = 0, coins = 0, score = 0;
  let p, things, spawnAt, coinAt, shake = 0, flash = 0, parts = [];

  function reset() {
    p = { x: W < 600 ? 90 : 130, y: GROUND - R, vy: 0, jumps: 0, rot: 0, squash: 0 };
    things = []; parts = [];
    t = 0; speed = 330; fit(); dist = 0; coins = 0; score = 0; spawnAt = 1.1; coinAt = 0.6; shake = 0; flash = 0;
  }

  function jump() {
    if (state !== "run") return;
    if (p.jumps >= 2) return;
    p.vy = -(p.jumps === 0 ? JUMP : JUMP * 0.86);
    p.jumps++; p.squash = 1;
    beep(p.jumps === 1 ? 420 : 560, 0.12, "square", 0.05, 260);
    for (let i = 0; i < 6; i++) parts.push({ x: p.x - 8, y: p.y + R, vx: -60 - Math.random() * 120, vy: -Math.random() * 120, life: 0.4, c: "#b9a8d6" });
  }

  function spawn() {
    const gap = Math.max(0.62, 1.35 - t * 0.012) * (0.8 + Math.random() * 0.7);
    spawnAt = t + gap;
    const roll = Math.random();
    if (t > 12 && roll < 0.28) {
      // rocket: flies at head height, stay on the ground or clear it with a double jump
      things.push({ kind: "rocket", x: W + 60, y: GROUND - R * 2 - 46 - Math.random() * 30, w: 62, h: 24, vx: 150 + Math.random() * 90 });
      spawnAt += 0.45;
    } else if (t > 6 && roll < 0.5) {
      things.push({ kind: "rock", x: W + 40, y: GROUND, w: 44, h: 74, tall: true });
    } else {
      const w = 40 + Math.random() * 30;
      things.push({ kind: "rock", x: W + 40, y: GROUND, w, h: 34 + Math.random() * 16 });
    }
  }

  function spawnCoins() {
    coinAt = t + 1.4 + Math.random() * 1.6;
    const n = 3 + Math.floor(Math.random() * 3), arc = Math.random() < 0.6, base = GROUND - 60 - Math.random() * 70;
    for (let i = 0; i < n; i++) {
      const lift = arc ? Math.sin((i / (n - 1)) * Math.PI) * 70 : 0;
      things.push({ kind: "coin", x: W + 60 + i * 46, y: base - lift, r: 13, spin: Math.random() * 6 });
    }
  }

  function hit(o) {
    if (o.kind === "coin") { const dx = p.x - o.x, dy = p.y - o.y; return dx * dx + dy * dy < (R + o.r) * (R + o.r); }
    // circle vs rectangle, with a forgiving hitbox
    const pad = 7, left = o.x - o.w / 2 + pad, right = o.x + o.w / 2 - pad;
    const top = (o.kind === "rock" ? o.y - o.h : o.y - o.h / 2) + pad, bottom = (o.kind === "rock" ? o.y : o.y + o.h / 2) - pad;
    const cx = Math.max(left, Math.min(p.x, right)), cy = Math.max(top, Math.min(p.y, bottom));
    const dx = p.x - cx, dy = p.y - cy, rr = R - 6;
    return dx * dx + dy * dy < rr * rr;
  }

  function update(dt) {
    t += dt;
    speed = Math.min(MAXSPEED, 330 + t * 9);
    dist += speed * dt;
    p.vy += GRAV * dt; p.y += p.vy * dt;
    if (p.y >= GROUND - R) {
      if (p.jumps > 0) p.squash = -1;
      p.y = GROUND - R; p.vy = 0; p.jumps = 0;
    }
    p.rot += (p.jumps ? 7 : speed / R * 0.35) * dt;
    p.squash *= Math.pow(0.001, dt);
    if (t >= spawnAt) spawn();
    if (t >= coinAt) spawnCoins();

    for (const o of things) {
      o.x -= (speed + (o.vx || 0)) * dt;
      if (o.kind === "coin") o.spin += dt * 6;
      if (o.dead) continue;
      if (hit(o)) {
        if (o.kind === "coin") {
          o.dead = true; coins++; flash = 0.12;
          beep(880, 0.08, "triangle", 0.06, 500);
          for (let i = 0; i < 8; i++) parts.push({ x: o.x, y: o.y, vx: (Math.random() - 0.5) * 260, vy: (Math.random() - 0.5) * 260, life: 0.35, c: "#ffd84a" });
        } else { end(); return; }
      }
    }
    things = things.filter((o) => o.x > -120 && !o.dead);
    for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 500 * dt; q.life -= dt; }
    parts = parts.filter((q) => q.life > 0);
    score = Math.floor(dist / 12) + coins * 10;
    $("score").textContent = score;
    if (flash > 0) flash -= dt;
  }

  function end() {
    state = "over"; shake = 0.35;
    beep(160, 0.4, "sawtooth", 0.07, -110);
    const record = score > best;
    if (record) { best = score; store.set("fumpo-run-best", String(best)); }
    $("best").textContent = best;
    $("final").textContent = score;
    $("over-title").textContent = record && score > 0 ? "New best!" : "Bonk!";
    $("over-sub").textContent = `${coins} coins grabbed. Best: ${best}.`;
    setTimeout(() => { if (state !== "over") return; $("over").hidden = false; $("again").focus({ preventScroll: true }); }, 450);
  }

  // ---- drawing
  function draw(dt) {
    ctx.save();
    if (shake > 0) { shake -= dt; ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10); }
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0b0416"); g.addColorStop(1, "#2a1050");
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);

    const scroll = state === "run" ? dist : t * 40;
    for (const s of stars) {
      const x = ((s.x - scroll * s.z * 0.15) % W + W) % W;
      ctx.globalAlpha = 0.5 + s.z; ctx.fillStyle = "#fff";
      ctx.fillRect(x, s.y * (GROUND - 60), s.s, s.s);
    }
    ctx.globalAlpha = 1;
    // far planet
    ctx.fillStyle = "#3b2a66"; ctx.beginPath(); ctx.arc(W - 120, 90, 54, 0, 7); ctx.fill();
    ctx.fillStyle = "#4a377d"; ctx.beginPath(); ctx.arc(W - 136, 76, 12, 0, 7); ctx.arc(W - 100, 104, 8, 0, 7); ctx.fill();
    // hills
    ctx.fillStyle = "#25123f";
    ctx.beginPath(); ctx.moveTo(0, GROUND);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, GROUND - 26 - Math.sin((x + scroll * 0.3) / 90) * 16 - Math.sin((x + scroll * 0.3) / 37) * 6);
    ctx.lineTo(W, GROUND); ctx.fill();
    // ground
    ctx.fillStyle = "#6b3fb0"; ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
    ctx.fillStyle = "#b6ff3c"; ctx.fillRect(-20, GROUND, W + 40, 4);
    ctx.fillStyle = "#552f93";
    for (const c of craters) {
      const x = ((c.x - scroll) % (W + 120) + W + 120) % (W + 120) - 60;
      ctx.beginPath(); ctx.ellipse(x, GROUND + 34, c.w, 9, 0, 0, 7); ctx.fill();
    }

    for (const o of things) {
      if (o.kind === "coin") {
        const sx = Math.abs(Math.cos(o.spin)) * 0.75 + 0.25;
        ctx.save(); ctx.translate(o.x, o.y); ctx.scale(sx, 1);
        ctx.fillStyle = "#ffd84a"; ctx.beginPath(); ctx.arc(0, 0, o.r, 0, 7); ctx.fill();
        ctx.strokeStyle = "#c98a00"; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = "#c98a00"; ctx.font = "900 15px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("F", 0, 1);
        ctx.restore();
      } else if (o.kind === "rock") {
        ctx.fillStyle = "#9d93b8"; ctx.beginPath();
        const l = o.x - o.w / 2, r = o.x + o.w / 2, top = o.y - o.h;
        ctx.moveTo(l, o.y); ctx.lineTo(l + o.w * 0.12, top + o.h * 0.3); ctx.lineTo(l + o.w * 0.42, top);
        ctx.lineTo(r - o.w * 0.2, top + o.h * 0.14); ctx.lineTo(r, o.y); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#7c7299"; ctx.beginPath();
        ctx.moveTo(o.x, o.y); ctx.lineTo(l + o.w * 0.42, top); ctx.lineTo(r - o.w * 0.2, top + o.h * 0.14); ctx.lineTo(r, o.y); ctx.closePath(); ctx.fill();
      } else {
        ctx.save(); ctx.translate(o.x, o.y);
        ctx.fillStyle = "#ff8a3c"; ctx.beginPath(); ctx.moveTo(o.w / 2, -5); ctx.lineTo(o.w / 2 + 16 + Math.random() * 12, 0); ctx.lineTo(o.w / 2, 5); ctx.fill();
        ctx.fillStyle = "#f4eeff"; ctx.beginPath(); ctx.moveTo(-o.w / 2, 0); ctx.quadraticCurveTo(-o.w / 4, -o.h / 2, o.w / 2, -o.h / 2); ctx.lineTo(o.w / 2, o.h / 2); ctx.quadraticCurveTo(-o.w / 4, o.h / 2, -o.w / 2, 0); ctx.fill();
        ctx.fillStyle = "#a24bff"; ctx.fillRect(o.w / 2 - 14, -o.h / 2 - 6, 14, o.h + 12);
        ctx.fillStyle = "#12081f"; ctx.beginPath(); ctx.arc(-6, 0, 5, 0, 7); ctx.fill();
        ctx.restore();
      }
    }

    for (const q of parts) { ctx.globalAlpha = Math.max(0, q.life * 2.5); ctx.fillStyle = q.c; ctx.fillRect(q.x, q.y, 5, 5); }
    ctx.globalAlpha = 1;

    // shadow + FUMPO
    const air = Math.min(1, (GROUND - R - p.y) / 200);
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(p.x, GROUND + 6, R * (1 - air * 0.5), 6 * (1 - air * 0.5), 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(p.x, p.y);
    const sq = p.squash * 0.18; ctx.scale(1 - sq, 1 + sq);
    ctx.rotate(p.jumps ? p.rot : Math.sin(p.rot) * 0.12);
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.closePath();
    ctx.save(); ctx.clip();
    if (face.complete && face.naturalWidth) ctx.drawImage(face, -R, -R, R * 2, R * 2);
    else { ctx.fillStyle = "#a24bff"; ctx.fillRect(-R, -R, R * 2, R * 2); }
    ctx.restore();
    ctx.lineWidth = 4; ctx.strokeStyle = flash > 0 ? "#ffd84a" : "#b6ff3c"; ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  // ---- loop
  let last = 0, running = true;
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000 || 0); last = now;
    if (running) {
      if (state === "run") update(dt); else t += dt;
      draw(dt);
    }
    requestAnimationFrame(frame);
  }
  document.addEventListener("visibilitychange", () => { running = !document.hidden; last = performance.now(); });

  function start() {
    reset(); state = "run";
    $("start").hidden = true; $("over").hidden = true;
    $("score").textContent = "0";
  }

  // ---- input
  $("stage").addEventListener("pointerdown", (e) => {
    if (e.target.closest("button, a")) return;
    e.preventDefault(); jump();
  });
  document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" && e.code !== "ArrowUp" && e.code !== "KeyW") return;
    if (e.target.closest("button, a") && state !== "run") return;   // let Enter/Space press the focused button
    e.preventDefault();
    if (state === "run") jump(); else if (!e.repeat) start();
  });
  $("play").addEventListener("click", start);
  $("again").addEventListener("click", start);
  $("mute").addEventListener("click", () => {
    muted = !muted; store.set("fumpo-run-muted", muted ? "1" : "0"); paintMute();
  });
  function paintMute() { $("mute").textContent = muted ? "Sound off" : "Sound on"; $("mute").setAttribute("aria-pressed", String(muted)); }
  $("share").addEventListener("click", async () => {
    const text = `I scored ${score} in FUMPO Moon Run 👾 Can you beat me?`;
    const url = "https://fumpocoin.xyz/game.html";
    try {
      if (navigator.share) { await navigator.share({ text, url }); return; }
    } catch { return; }
    window.open("https://t.me/share/url?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent(text), "_blank", "noopener");
  });

  // test hook, used only for automated checks
  window.__moonrun = { peek: () => ({ px: p.x, py: p.y, ground: GROUND, speed, jumps: p.jumps, obs: things.filter((o) => o.kind !== "coin").map((o) => ({ kind: o.kind, x: o.x, w: o.w, h: o.h, vx: o.vx || 0 })) }), get: () => ({ state, score, coins, t, things: things ? things.length : 0, y: p && p.y }), start, jump, step: (n, dt = 1 / 60) => { for (let i = 0; i < n && state === "run"; i++) update(dt); draw(0); } };

  fit(); reset(); paintMute(); $("best").textContent = best;
  requestAnimationFrame(frame);
})();
</script>
<script data-goatcounter="https://fumpcoin.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
