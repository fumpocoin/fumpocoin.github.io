name: Update Telegram member count
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_members.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet members.json; then
            git config user.name "FUMPO"
            git config user.email "359993081+fumpocoin@users.noreply.github.com"
            git commit -qam "Update member count"
            git push -q
          fi
