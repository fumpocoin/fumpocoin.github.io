<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<title>FUMPO: Moon Meadow</title>
<link rel="icon" href="../logo.png">
<style>
  :root { --panel: rgba(18, 8, 31, .78); --line: #4a2f73; --text: #f4eeff; --muted: #c9b8e6; --purple: #a24bff; --lime: #b6ff3c; --ink: #12081f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0420; color: var(--text); overflow: hidden; overscroll-behavior: none; }
  body { font: 15px/1.45 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  [hidden] { display: none !important; }
  button { font: inherit; }
  .hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 12px 0; display: flex; gap: 8px; align-items: center; pointer-events: none; }
  .pill { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #hearts { color: #ff4d6d; font-size: 20px; letter-spacing: 2px; }
  .coin { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: #ffd23c; border: 2px solid #a8741a; vertical-align: -2px; margin-right: 6px; }
  .track { flex: 1; max-width: 260px; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .15); overflow: hidden; margin: 0 4px; }
  .track i { display: block; height: 100%; width: 0; background: var(--lime); border-radius: 99px; }
  .hud .sp { flex: 1; }
  .small { pointer-events: auto; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .tbtn { position: fixed; display: none; bottom: calc(26px + env(safe-area-inset-bottom)); width: 78px; height: 78px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .45); background: rgba(255, 255, 255, .12); color: #fff; font-size: 30px; font-weight: 900; }
  .tbtn.on { background: rgba(182, 255, 60, .55); border-color: var(--lime); }
  #t-left { left: 18px; } #t-right { left: 108px; }
  #t-jump { right: 20px; width: 96px; height: 96px; border-color: var(--lime); font-size: 16px; }
  body.touch .tbtn { display: block; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 18px; text-align: center; background: rgba(13, 4, 32, .55); }
  #title { background: none; align-items: start; justify-items: end; padding: 16vh 7vw 0 0; }
  #title .card { text-align: center; }
  @media (max-width: 700px) { #title { justify-items: center; padding: 11vh 16px 0; } }
  .card { max-width: 440px; }
  .card.box { background: #1d1030; border: 1px solid var(--line); border-radius: 22px; padding: 26px 24px; }
  h1 { margin: 0 0 6px; font-size: clamp(34px, 9vw, 64px); line-height: 1; color: var(--lime); text-shadow: 0 4px 0 var(--purple), 0 10px 30px rgba(0, 0, 0, .5); font-weight: 900; letter-spacing: -.02em; }
  .card p { color: var(--muted); margin: 0 0 16px; font-size: 16px; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .b { border: 2px solid var(--purple); background: rgba(18, 8, 31, .6); color: var(--text); border-radius: 16px; padding: 12px 24px; font-weight: 900; cursor: pointer; text-decoration: none; font-size: 17px; }
  .b.primary { background: var(--lime); border-color: var(--lime); color: var(--ink); box-shadow: 0 6px 0 #6fa30f; }
  .b.primary:active { transform: translateY(3px); box-shadow: 0 3px 0 #6fa30f; }
  .stars { font-size: 44px; color: #ffd23c; letter-spacing: 6px; text-shadow: 0 0 18px rgba(255, 210, 60, .5); margin: 4px 0 8px; }
  .note { font-size: 13px !important; margin-top: 14px !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <span class="pill" id="hearts">♥♥♥</span>
  <span class="pill"><i class="coin"></i><span id="coins">0</span></span>
  <div class="track"><i id="progress"></i></div>
  <span class="sp"></span>
  <button class="small" id="btn-mute" type="button">Sound on</button>
  <button class="small" id="btn-pause" type="button">Pause</button>
</div>

<button class="tbtn" id="t-left" type="button" aria-label="Move left">&#9664;</button>
<button class="tbtn" id="t-right" type="button" aria-label="Move right">&#9654;</button>
<button class="tbtn" id="t-jump" type="button">JUMP</button>

<div class="overlay" id="title">
  <div class="card">
    <h1>FUMPO</h1>
    <p>Moon Meadow · Level 1<br>Grab the coins, stomp the FUD, reach the rocket.</p>
    <div class="btns"><button class="b primary" id="btn-start" type="button">Play</button></div>
    <p class="note">Arrows or A/D to run · Space to jump<br>Jump again in the air for a double jump</p>
  </div>
</div>
<div class="overlay" id="pause" hidden>
  <div class="card box"><h1>Paused</h1><p>FUMPO is catching his breath.</p>
    <div class="btns"><button class="b primary" id="btn-resume" type="button">Resume</button><button class="b" id="btn-restart" type="button">Restart</button></div></div>
</div>
<div class="overlay" id="over" hidden>
  <div class="card box"><h1>Ouch!</h1><p>The FUD got you this time.</p>
    <div class="btns"><button class="b primary" id="btn-retry" type="button">Try again</button><a class="b" href="../">Back to site</a></div></div>
</div>
<div class="overlay" id="win" hidden>
  <div class="card box"><h1>To the moon!</h1><div class="stars" id="win-stars">★★★</div><p id="win-sub"></p>
    <div class="btns"><button class="b primary" id="btn-again" type="button">Play again</button><a class="b" href="../">Back to site</a></div></div>
</div>

<script type="module" src="src/game.js"></script>
<script data-goatcounter="https://fumpcoin.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
